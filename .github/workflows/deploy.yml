name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: my-app
        run: npm install

      - name: Build app
        working-directory: my-app
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: my-app/dist
          cname: www.ascendons.in

      - name: Deploy to ascendons/web (www.ascendons.com)
        uses: peaceiris/actions-gh-pages@v3
        with:
          deploy_key: ${{ secrets.WEB_DEPLOY_KEY }}
          external_repository: ascendons/web
          publish_branch: main
          publish_dir: my-app/dist
          cname: www.ascendons.com
          enable_jekyll: false
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: Deploy from ascendons/spa
